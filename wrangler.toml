name = "eve-freight-cost-calculator"
compatibility_date = "2024-11-01"

# `npx wrangler deploy` runs this first, then uploads ./dist.
[build]
command = "npm run build"

# Serve the Vite build as a static site (no Worker script needed).
# SPA fallback keeps deep links working even though state lives in the query string.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
